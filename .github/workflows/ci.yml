name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build application
        run: npm run build
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install
      - name: Build Firebase Functions
        working-directory: functions
        run: npm run build
      - name: Validate Firestore rules with emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-qdcom "echo Firestore rules loaded"
